server.port=8080

# PostgreSQL local (ex.: docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workshop}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Seed canonico local
app.seed.enabled=true
app.seed.locations=classpath:db/seed/canonical-seed.sql

# Security (valor padrao para dev local sem Docker; docker-compose.yaml
# sobrescreve via JWT_SECRET/DEFAULT_USER_PASSWORD/API_KEY_CHATBOT)
security.jwt.secret=${JWT_SECRET:local-dev-secret-key-for-testing-only}
user.password.default=${DEFAULT_USER_PASSWORD:default123}
authentication.chatbot.api.key=${API_KEY_CHATBOT:local-chatbot-api-key}

# Kafka (local)
app.budget.kafka.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
