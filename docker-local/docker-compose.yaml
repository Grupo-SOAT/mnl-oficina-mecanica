services:
  postgres:
    image: postgres:16
    container_name: workshop-db
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d workshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.9.1
    container_name: workshop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENERS: 'CONTROLLER://kafka:29093,PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: 'ciWo7IWazngRchmPES6q5A'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: workshop-kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: workshop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  mailpit:
    image: axllent/mailpit:latest
    container_name: workshop-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # --- Observability demo stack ---

  otel-agent:
    image: curlimages/curl:8.11.1
    container_name: workshop-otel-agent
    user: "0:0"
    command:
      - "-f"
      - "-L"
      - "-o"
      - "/otel/opentelemetry-javaagent.jar"
      - "https://repo1.maven.org/maven2/io/opentelemetry/javaagent/opentelemetry-javaagent/2.31.1/opentelemetry-javaagent-2.31.1.jar"
    volumes:
      - otel-agent:/otel

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: workshop-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workshop
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: mnl-oficina-mecanica
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oficina-mecanica
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - otel-agent:/otel
    depends_on:
      otel-agent:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  alloy:
    image: grafana/alloy:v1.13.2
    container_name: workshop-alloy
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
      - tempo
      - prometheus

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: workshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"

  loki:
    image: grafana/loki:3.4.1
    container_name: workshop-loki
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml
    command:
      - "-config.file=/etc/loki/local-config.yaml"

  tempo:
    image: grafana/tempo:2.7.1
    container_name: workshop-tempo
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo/config.yaml
    command:
      - "-config.file=/etc/tempo/config.yaml"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: workshop-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: alerts@oficina.local
      GF_SMTP_FROM_NAME: Oficina Observabilidade
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
      - tempo

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: workshop-blackbox
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    depends_on:
      app:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: workshop-kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:29092"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  otel-agent:
