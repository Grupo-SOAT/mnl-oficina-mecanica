apiVersion: 1

groups:
  - orgId: 1
    name: processamento-OS
    folder: Observabilidade
    interval: 30s
    rules:
      - uid: falha-processamento-orcamento
        title: Falha no processamento de OS (orçamento)
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(increase(budget_decision_processing_failures_total[5m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
            relativeTimeRange:
              from: 300
              to: 0
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          alertname: FalhaNoProcessamentoOS
          team: oficina
        annotations:
          summary: 'Falha no processamento de orçamento de ordem de serviço detectada'
          description: 'Número de decisões de orçamento de OS que falharam no processamento nos últimos 5 minutos (contador budget_decision_processing_failures_total). Dispara quando o valor é maior que 0.'

      - uid: mensagens-na-dlt
        title: Mensagens na DLT de ordem de serviço
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(kafka_consumergroup_lag{consumergroup=~"workshop-group-dlt.*"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
            relativeTimeRange:
              from: 300
              to: 0
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          alertname: MensagensNaDLT
          team: oficina
        annotations:
          summary: 'Mensagens não processadas na DLT de ordem de serviço'
          description: 'Número de mensagens retidas na DLT de orçamento (topico budget-decision-dlt), medido pelo lag do grupo workshop-group-dlt. Dispara quando o valor é maior que 0.'

      - uid: erros-5xx-em-os
        title: Erros HTTP 5xx em ordens de serviço
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(increase(http_server_requests_seconds_count{status=~"5..", uri=~"/service-orders.*"}[5m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
            relativeTimeRange:
              from: 300
              to: 0
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          alertname: Erros5xxEmOS
          team: oficina
        annotations:
          summary: 'Erros HTTP 5xx nas rotas de ordem de serviço'
          description: 'Número de respostas HTTP 5xx nas rotas de ordem de serviço (http_server_requests_seconds_count status 5xx) nos últimos 5 minutos. Dispara quando o valor é maior que 0.'
