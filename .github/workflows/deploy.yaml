name: Deploy Application

on:
  workflow_dispatch:

jobs:

  deploy:

    name: Deploy Monolito

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Application
        run: |
          mvn clean package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure Image Variables
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          ECR_REPOSITORY="registry-oficina-mecanica-mnl"
          IMAGE_TAG="${GITHUB_SHA}"

          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "ECR Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker Image
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update and Merge Kubernetes Manifest
        env:
          GH_TOKEN: ${{ secrets.PAT_REPO_INFRA_LAMBDA }}
          INFRA_REPO_URL: ${{ vars.GIT_INFRA_REPO_URL }}
          INFRA_BRANCH: ${{ vars.GIT_INFRA_BRANCH }}
        run: |
          set -e

          INFRA_REPO="${INFRA_REPO_URL#https://github.com/}"

          echo "Clonando repositório GitOps..."

          git clone \
            "https://x-access-token:${{ secrets.PAT_REPO_INFRA_LAMBDA }}@${INFRA_REPO_URL#https://}" \
            k8s-infra

          cd k8s-infra

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          CONFIG_FILE="k8s/deployment-monolito.yaml"
          BRANCH_NAME="chore/update-monolito-image-${GITHUB_RUN_ID}"

          echo "Imagem: ${IMAGE}"
          echo "Arquivo: ${CONFIG_FILE}"
          echo "Branch: ${BRANCH_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Criando branch..."
          git checkout -b "$BRANCH_NAME"

          echo "Atualizando imagem do monólito..."

          sed -i "/- name: workshop-backend/{n;s|image:.*|image: ${IMAGE}|;}" "$CONFIG_FILE"

          echo "Alterações realizadas:"
          git diff -- "$CONFIG_FILE"

          echo "Criando commit..."

          git add "$CONFIG_FILE"

          git commit \
            -m "chore: update monolito image to ${IMAGE_TAG}"

          echo "Enviando branch para o repositório GitOps..."

          git push origin "$BRANCH_NAME"

          echo "Criando Pull Request..."

          PR_URL=$(gh pr create \
            --repo "$INFRA_REPO" \
            --base "$INFRA_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "chore: update monolito image to ${IMAGE_TAG}" \
            --body "Atualização automática da imagem Docker do monólito.

          Image: ${IMAGE}

          Gerado pelo repositório:
          ${GITHUB_REPOSITORY}

          Workflow run:
          ${GITHUB_RUN_ID}")

          echo "Pull Request criado:"
          echo "$PR_URL"

          echo "Fazendo merge do Pull Request..."

          gh pr merge "$PR_URL" \
            --repo "$INFRA_REPO" \
            --merge \
            --delete-branch

          echo "Pull Request mergeado com sucesso."
          echo "Branch ${BRANCH_NAME} excluída."